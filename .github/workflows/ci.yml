name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true # runs bundle install and caches gems automatically

      - name: Run hand-written Cucumber suite
        run: bundle exec cucumber

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: ${{ runner.os }}-informers-minilm

      - name: Generate feature file from plain-English scenarios
        run: bundle exec ruby generate_feature.rb scenarios.txt "CI generated login flows"

      - name: Validate generated feature file (dry-run)
        run: bundle exec cucumber features/generated_ci_generated_login_flows.feature --dry-run --strict

      - name: Run generated feature file for real
        run: bundle exec cucumber features/generated_ci_generated_login_flows.feature  

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: tmp/*.png